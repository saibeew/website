version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node --version
        - npm --version
        - npm ci
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|POSTGRES_SSL|POSTGRES_POOL_MAX|AUTH_SESSION_DAYS|DEFAULT_INITIAL_BALANCE|NEXT_PUBLIC_DEFAULT_INITIAL_BALANCE|NEXT_PUBLIC_ENABLE_DEMO_DATA|NEXT_PUBLIC_APP_URL|OPENAI_API_KEY|GEMINI_API_KEY|RESEND_API_KEY|RESEND_FROM_EMAIL|TELEGRAM_WAR_ROOM_URL|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TRADING_WORKER_API_KEY|NEXT_PUBLIC_LEMON_SQUEEZY_FOUNDING_URL|NEXT_PUBLIC_TELEGRAM_URL|NEXT_PUBLIC_LINKEDIN_URL|NEXT_PUBLIC_YOUTUBE_URL|NEXT_PUBLIC_X_URL)=' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
